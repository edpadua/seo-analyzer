{% extends "base.html" %}

{% block title %}Sign Up - SEO Pro Analyzer{% endblock %}

{% block content %}
<div class="row justify-content-center mt-5">
    <div class="col-md-5">
        <div class="card shadow-sm p-4">
            <h2 class="h4 text-center mb-4">Create New Account</h2>
            <form action="/register" method="post">
                <div class="mb-3">
                    <label class="form-label">Full Name</label>
                    <input type="text" name="name" class="form-control" placeholder="Your name" required>
                </div>
                <div class="mb-3">
                    <label class="form-label">Email</label>
                    <input type="email" name="email" class="form-control" placeholder="your@email.com" required>
                </div>
                <div class="mb-3">
                    <label class="form-label">Password</label>
                    <input type="password" name="password" class="form-control" placeholder="Minimum 6 characters" required>
                </div>
                <button type="submit" class="btn btn-primary w-100 mt-2">Complete Registration</button>
            </form>
            <hr>
            <div class="text-center">
                <p class="text-muted small">Already have an account? <a href="/login-email">Sign In</a></p>
            </div>
        </div>
    </div>
</div>
{% endblock %}
