<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Settings - SEO Pro</title>
    <style>
        body { font-family: 'Inter', sans-serif; background: #f8fafc; text-align: center; padding-top: 50px; }
        .box { background: white; max-width: 500px; margin: auto; padding: 40px; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.05); }
        input { width: 100%; padding: 12px; margin: 20px 0; border: 1px solid #ddd; border-radius: 8px; }
        button { background: #2563eb; color: white; border: none; padding: 15px 30px; border-radius: 8px; cursor: pointer; font-weight: bold; }
    </style>
</head>
<body>
    <div class="box">
        <h2>AI Configuration</h2>
        <p>Enter your OpenAI API Key to enable strategic analysis features.</p>
        <form action="/save-settings" method="post">
            <input type="password" name="openai_key" value="{{ user.openai_key or '' }}" placeholder="sk-...">
            <button type="submit">Save Settings</button>
        </form>
        <br><a href="/">Back to Home</a>
    </div>
</body>
</html>
