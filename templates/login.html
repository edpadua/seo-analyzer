<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In - SEO Pro Tool</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        body { 
            font-family: 'Inter', sans-serif; 
            background: #f8fafc; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            height: 100vh; 
            margin: 0; 
        }
        .login-card { 
            background: white; 
            padding: 40px; 
            border-radius: 20px; 
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 10px 10px -5px rgba(0, 0, 0, 0.04); 
            width: 100%; 
            max-width: 400px; 
            text-align: center;
        }
        .logo-placeholder {
            font-size: 32px;
            font-weight: 800;
            color: #2563eb;
            margin-bottom: 10px;
        }
        h2 { color: #1e293b; margin-bottom: 8px; font-size: 24px; }
        p { color: #64748b; font-size: 14px; margin-bottom: 30px; }

        .btn-google {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            width: 100%;
            background: white;
            color: #374151;
            border: 1px solid #d1d5db;
            padding: 12px;
            border-radius: 10px;
            font-weight: 600;
            font-size: 15px;
            cursor: pointer;
            text-decoration: none;
            transition: all 0.2s ease;
        }
        .btn-google:hover {
            background: #f9fafb;
            border-color: #9ca3af;
            box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05);
        }
        .btn-google img { width: 20px; height: 20px; }

        .footer-text {
            margin-top: 25px;
            font-size: 12px;
            color: #94a3b8;
        }
    </style>
</head>
<body>

    <div class="login-card">
        <div class="logo-placeholder">⚔️ SEO Pro</div>
        <h2>Welcome back</h2>
        <p>Analyze the competition with real intelligence.</p>

        <a href="/login/google" class="btn-google">
            <img src="https://www.gstatic.com/images/branding/product/1x/gsa_512dp.png" alt="Google Logo">
            Sign in with Google
        </a>

        <div class="footer-text">
            By signing in, you agree to our Terms of Service and Privacy Policy.
        </div>
    </div>

</body>
</html>
